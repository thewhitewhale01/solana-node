# Anza-recommended kernel settings for agave-validator
# UDP buffers (turbine/gossip/repair)
net.core.rmem_default = 134217728
net.core.rmem_max = 134217728
net.core.wmem_default = 134217728
net.core.wmem_max = 134217728
# mmap'd accounts files
vm.max_map_count = 2000000
# file handles
fs.nr_open = 2000000
fs.file-max = 2000000
# keep the box from swapping the accounts cache out
vm.swappiness = 1
